<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kanban Go</title>
        <link rel="stylesheet" href="/styles.css">
        <script src="/app.js" defer></script>
    </head>
    <body>
        <main id="auth-screen" class="auth-screen" hidden>
            <section class="auth-panel" aria-labelledby="auth-title">
                <div class="auth-brand">Kanban Go</div>
                <h1 id="auth-title">Log in</h1>
                <form id="login-form" class="auth-form">
                    <label for="login-username">Username</label>
                    <input id="login-username" name="username" autocomplete="username" maxlength="64" required>
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
                    <button type="submit">Log in</button>
                    <button id="show-register" type="button" class="secondary" hidden>Create account</button>
                </form>
                <form id="register-form" class="auth-form" hidden>
                    <label for="register-username">Username</label>
                    <input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
                    <label for="register-password">Password</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required>
                    <label for="register-confirm">Confirm password</label>
                    <input id="register-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="200" required>
                    <button type="submit">Create account</button>
                    <button id="show-login" type="button" class="secondary">Back to login</button>
                </form>
            </section>
        </main>

        <div id="app-shell" hidden>
        <header class="topbar">
            <div class="brand">
                Kanban Go <span class="prototype">Prototype</span>
                <span id="connection-status" class="connection-status connecting">Connecting</span>
            </div>
            <form id="quick-add" class="quick-add">
                <label class="sr-only" for="quick-title">Task title</label>
                <input id="quick-title" name="title" maxlength="200" placeholder="Add a task" required>
                <button type="submit">Add</button>
            </form>
            <div class="topbar-actions">
                <button id="account-summary" type="button" class="account-summary secondary">
                    <span id="current-user" class="current-user"></span>
                    <span id="current-points" class="current-points">0 pts</span>
                </button>
                <button id="settings-button" type="button" class="secondary">Settings</button>
                <button id="new-task" type="button" class="secondary">New task</button>
                <button id="logout-button" type="button" class="secondary">Log out</button>
            </div>
        </header>

        <div class="board-scroll">
            <main id="board" class="board" aria-live="polite"></main>
        </div>

        <aside id="editor" class="editor" aria-hidden="true">
            <div class="editor-header">
                <h2 id="editor-title">Task</h2>
                <button id="close-editor" type="button" class="secondary">Close</button>
            </div>
            <form id="task-form">
                <label for="task-title">Title</label>
                <input id="task-title" maxlength="200" required>

                <label for="task-description">Description</label>
                <textarea id="task-description" rows="6" maxlength="20000"></textarea>

                <div id="task-context" class="task-context" hidden></div>

                <div id="block-note-wrap" hidden>
                    <label for="task-block-note">Block note</label>
                    <textarea id="task-block-note" rows="3" maxlength="5000"></textarea>
                </div>

                <div class="form-row">
                    <div>
                        <label for="task-scheduled">Scheduled for</label>
                        <input id="task-scheduled" type="datetime-local">
                    </div>
                    <div>
                        <label for="task-lead">Lead days</label>
                        <input id="task-lead" type="number" min="0" step="1" value="0">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="task-recurrence">Recurrence</label>
                        <select id="task-recurrence">
                            <option value="none">None</option>
                            <option value="rolling">Rolling</option>
                            <option value="anchored">Anchored</option>
                        </select>
                    </div>
                    <div>
                        <label for="task-recurrence-days">Interval days</label>
                        <input id="task-recurrence-days" type="number" min="1" step="1" value="30">
                    </div>
                </div>

                <fieldset id="weekday-options" hidden>
                    <legend>Weekdays</legend>
                    <div class="weekday-grid">
                        <label><input type="checkbox" value="1"> Mon</label>
                        <label><input type="checkbox" value="2"> Tue</label>
                        <label><input type="checkbox" value="3"> Wed</label>
                        <label><input type="checkbox" value="4"> Thu</label>
                        <label><input type="checkbox" value="5"> Fri</label>
                        <label><input type="checkbox" value="6"> Sat</label>
                        <label><input type="checkbox" value="0"> Sun</label>
                    </div>
                </fieldset>

                <label class="checkbox-line">
                    <input id="task-paused" type="checkbox">
                    Pause recurrence
                </label>

                <label class="checkbox-line">
                    <input id="task-time-critical" type="checkbox">
                    Time critical
                </label>

                <fieldset>
                    <legend>Dependencies</legend>
                    <div id="dependency-list" class="dependency-list"></div>
                </fieldset>

                <div class="editor-actions">
                    <button type="submit">Save</button>
                    <button id="cancel-editor" type="button" class="secondary">Cancel</button>
                    <button id="delete-task" type="button" class="danger delete" hidden>Delete</button>
                </div>
            </form>
        </aside>

        <aside id="settings" class="editor" aria-hidden="true">
            <div class="editor-header">
                <h2>Settings</h2>
                <button id="close-settings" type="button" class="secondary">Close</button>
            </div>
            <form id="settings-form">
                <fieldset>
                    <legend>Appearance</legend>
                    <label for="palette-select">Palette</label>
                    <select id="palette-select">
                        <option value="standard">Standard</option>
                        <option value="dark">Dark</option>
                        <option value="forest">Forest</option>
                        <option value="contrast">High contrast</option>
                    </select>
                </fieldset>
                <fieldset>
                    <legend>WIP limits</legend>
                    <div class="settings-grid">
                        <label for="limit-Waiting">Waiting</label>
                        <input id="limit-Waiting" type="number" min="0" step="1" placeholder="No limit">
                        <label for="limit-Ready">Ready</label>
                        <input id="limit-Ready" type="number" min="0" step="1" placeholder="No limit">
                        <label for="limit-InProgress">In Progress</label>
                        <input id="limit-InProgress" type="number" min="0" step="1" placeholder="No limit">
                        <label for="limit-Blocked">Blocked</label>
                        <input id="limit-Blocked" type="number" min="0" step="1" placeholder="No limit">
                        <label for="limit-Suspended">Suspended</label>
                        <input id="limit-Suspended" type="number" min="0" step="1" placeholder="No limit">
                        <label for="limit-Done">Done</label>
                        <input id="limit-Done" type="number" min="0" step="1" placeholder="No limit">
                    </div>
                </fieldset>
                <div class="editor-actions">
                    <button type="submit">Save</button>
                    <button id="cancel-settings" type="button" class="secondary">Cancel</button>
                </div>
            </form>
            <form id="password-form">
                <fieldset>
                    <legend>Change password</legend>
                    <div class="password-fields">
                        <label for="current-password">Current password</label>
                        <input id="current-password" type="password" autocomplete="current-password" maxlength="200" required>
                        <label for="new-password">New password</label>
                        <input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required>
                        <label for="confirm-password">Confirm new password</label>
                        <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required>
                    </div>
                    <button type="submit">Change password</button>
                </fieldset>
            </form>
        </aside>
        <div id="backdrop" class="backdrop" hidden></div>

        <dialog id="history-dialog" class="history-dialog">
            <div class="dialog-header">
                <div>
                    <h2>Completion history</h2>
                    <div id="history-summary" class="history-summary"></div>
                </div>
                <button id="close-history" type="button" class="secondary">Close</button>
            </div>
            <div class="heatmap-scroll">
                <div id="heatmap-grid" class="heatmap-grid" aria-label="Task completions in the last year"></div>
            </div>
            <div class="heatmap-legend" aria-hidden="true">
                <span>Less</span>
                <span class="heatmap-cell level-0"></span>
                <span class="heatmap-cell level-1"></span>
                <span class="heatmap-cell level-2"></span>
                <span class="heatmap-cell level-3"></span>
                <span class="heatmap-cell level-4"></span>
                <span>More</span>
            </div>
        </dialog>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </body>
</html>
